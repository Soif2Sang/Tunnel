name: Tunnel
options:
  bundleIdPrefix: com.soif2sang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Tunnel:
    type: application
    platform: macOS
    sources:
      - path: Tunnel
        excludes:
          - "**/*.xcassets/AppIcon.appiconset/**"
    settings:
      base:
        INFOPLIST_FILE: Tunnel/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.soif2sang.tunnel
        PRODUCT_NAME: Tunnel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
    info:
      path: Tunnel/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Tunnel
        CFBundleDisplayName: Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"

  TunnelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TunnelTests
    dependencies:
      - target: Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soif2sang.tunnel.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tunnel.app/Contents/MacOS/Tunnel"
        BUNDLE_LOADER: "$(TEST_HOST)"
