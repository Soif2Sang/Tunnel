name: Berth
options:
  bundleIdPrefix: com.soif2sang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Berth:
    type: application
    platform: macOS
    sources:
      - path: Berth
        excludes:
          - "**/*.xcassets/AppIcon.appiconset/**"
    settings:
      base:
        INFOPLIST_FILE: Berth/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.soif2sang.berth
        PRODUCT_NAME: Berth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
    info:
      path: Berth/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Berth
        CFBundleDisplayName: Berth
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"

  BerthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BerthTests
    dependencies:
      - target: Berth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soif2sang.berth.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Berth.app/Contents/MacOS/Berth"
        BUNDLE_LOADER: "$(TEST_HOST)"
